name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PdfBatchLocker --collect-all pypdf pdf_batch_locker\__main__.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PdfBatchLocker-windows
          path: dist/PdfBatchLocker.exe
